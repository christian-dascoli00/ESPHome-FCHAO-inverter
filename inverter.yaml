# Configuration

esphome:
  name: inverter

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

substitutions:
  inverter_tx_pin: GPIO26
  inverter_rx_pin: GPIO25
  inverter_switch_pin: GPIO13
  inverter_flow_pin: GPIO14

#ESPHome parameters

ota:
  - platform: esphome
    password: ""

api:

web_server:
  port: 80

logger:
  level: INFO

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

# Inverter switch ON/OFF

switch:
  - platform: gpio # See README
    name: "Inverter Switch"
    pin: ${inverter_switch_pin}
    id: inverter_switch

# Inverter decoding

uart:
  - id: uart_inverter
    tx_pin: ${inverter_tx_pin}
    rx_pin: ${inverter_rx_pin}
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

output:
  - platform: gpio
    pin: ${inverter_flow_pin}
    id: inverter_flow

interval:
  - interval: 1000ms # Up to you
    then:
            - lambda: |- # Request
                uint8_t req[] = {0xAE, 0x01, 0x01, 0x03, 0x05, 0xEE};
                id(inverter_flow).turn_on();
                id(uart_inverter).write_array(req, sizeof(req));
                id(uart_inverter).flush();
                id(inverter_flow).turn_off(); 
            - delay: 50ms
            - lambda: |- # Decoding
                static uint8_t buf[64];
                static size_t buf_len = 0;
                static uint32_t last_valid_ms = 0;

                auto bcd2 = [](uint8_t hi, uint8_t lo) -> int {
                  return ((hi >> 4) * 10 + (hi & 0x0F)) * 100
                       + ((lo >> 4) * 10 + (lo & 0x0F));
                };

                while (id(uart_inverter).available() && buf_len < sizeof(buf)) {
                  uint8_t c;
                  id(uart_inverter).read_byte(&c);
                  buf[buf_len++] = c;
                }

                size_t consumed = 0;
                for (size_t i = 0; i + 17 <= buf_len; i++) {
                  if (buf[i] == 0xAE && buf[i+1] == 0x01 && buf[i+2] == 0x12
                      && buf[i+16] == 0xEE) {

                    char hexline[17 * 3 + 1];
                    for (size_t k = 0; k < 17; k++) {
                      sprintf(hexline + k * 3, "%02X ", buf[i + k]);
                    }
                    ESP_LOGD("INVERTER", "Packet: %s", hexline);

                    int volt_ac   = bcd2(buf[i+4],  buf[i+5]);
                    int power   = bcd2(buf[i+6],  buf[i+7]);
                    int volt_batt = bcd2(buf[i+8],  buf[i+9]);
                    int temp      = bcd2(buf[i+10], buf[i+11]);

                    id(inverter_voltage).publish_state(volt_ac);
                    id(inverter_power).publish_state(power);
                    id(battery_voltage).publish_state(volt_batt / 10.0);
                    id(inverter_temperature).publish_state(temp);

                    uint8_t status_byte = buf[i+13];
                    bool overload = (status_byte == 0x04);
                    id(inverter_overload).publish_state(overload);

                    last_valid_ms = millis();
                    consumed = i + 17;
                    break;
                  }
                }

                if (consumed > 0) {
                  memmove(buf, buf + consumed, buf_len - consumed);
                  buf_len -= consumed;
                }

                if (buf_len >= sizeof(buf)) {
                  buf_len = 0;
                }

                if (last_valid_ms != 0 && (millis() - last_valid_ms > 5000)) {
                  id(inverter_voltage).publish_state(NAN);
                  id(inverter_power).publish_state(NAN);
                  id(battery_voltage).publish_state(NAN);
                  id(inverter_temperature).publish_state(NAN);
                }

sensor:
  - platform: template
    name: "Inverter Power"
    id: inverter_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "AC Voltage"
    id: inverter_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "DC Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "Temperature"
    id: inverter_temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    name: "Overload"
    id: inverter_overload