external_components:
  - source: components

esphome:
  name: inverter
  #on_boot:
  #  - priority: -100
  #    then:
  #      - lambda: |-
  #          id(inverter1).stop_poller();

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80
  local: true
  version: 3

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf

uart:
  #id: uart_inverter
  tx_pin: GPIO25
  rx_pin: GPIO26
  baud_rate: 9600


fchao_inverter:
  - id: inverter1
    #uart_id: uart_inverter
    update_interval: 1s
    flow_control_pin: GPIO27
    #rx_timeout: 200ms
    #data_timeout: 1s
    #send_request: true

sensor:
  - platform: fchao_inverter
    #fchao_inverter_id: inverter1
    ac_voltage:
      name: "Inverter Voltage"
      id: inverter_voltage
    power:
      name: "Inverter Power"
      id: inverter_power
    battery_voltage:
      name: "Battery Voltage"
      id: battery_voltage
    temperature:
      name: "Inverter Temperature"
      id: inverter_temperature

switch:
  - platform: gpio
    pin: GPIO13
    name: "Inverter"
    #on_turn_on:
    #  - lambda: |-
    #      id(inverter1).start_poller();
    #on_turn_off:
